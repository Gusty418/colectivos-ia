<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colectivos IA</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #17202a;
}

.contenedor {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

.tarjeta {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    margin-top: 5px;
}

h2 {
    margin-top: 0;
}

.subtitulo {
    text-align: center;
    color: #667;
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
select,
button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-size: 16px;
}

input,
select {
    border: 1px solid #ccd3dc;
    background: white;
}

button {
    border: none;
    margin-top: 12px;
    font-weight: bold;
    cursor: pointer;
}

.guardar {
    background: #1769ff;
    color: white;
}

.parada {
    background: #1769ff;
    color: white;
}

.gps {
    background: #e8f0ff;
    color: #174ea6;
}

.exportar {
    background: #e7f6ec;
    color: #176b36;
}

.borrar {
    background: #ffe8e8;
    color: #b00020;
}

#mapa {
    height: 400px;
    width: 100%;
    border-radius: 15px;
    margin-top: 15px;
}

.estado {
    padding: 12px;
    background: #eef5ff;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
}

.contador {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.observacion {
    border-top: 1px solid #ddd;
    padding: 12px 0;
    font-size: 14px;
}

.pequeno {
    color: #667;
    font-size: 12px;
}

</style>

</head>

<body>

<div class="contenedor">


<div class="tarjeta">

<h1>🚌 Colectivos IA</h1>

<div class="subtitulo">
Registro de colectivos y paradas
</div>

<div class="estado">
📍 Tocá el mapa para crear una parada
</div>

<div id="mapa"></div>

<button
    class="parada"
    id="botonAgregarParada"
>
📍 Agregar parada
</button>

</div>


<div class="tarjeta">

<h2>🚌 Registrar observación</h2>

<form id="formulario">


<label>📅 Fecha</label>

<input
    type="date"
    id="fecha"
    required
>


<label>🕐 Hora</label>

<input
    type="time"
    id="hora"
    required
>


<label>🚌 Línea</label>

<input
    type="text"
    id="linea"
    placeholder="Ej: 108A"
    required
>


<label>📍 Parada</label>

<select
    id="paradaSeleccionada"
    required
>

<option value="">
Seleccionar parada
</option>

</select>


<label>➡️ Sentido</label>

<select id="sentido">

<option value="Ida">
Ida
</option>

<option value="Vuelta">
Vuelta
</option>

</select>


<label>🚗 Tráfico (1-5)</label>

<input
    type="number"
    id="trafico"
    min="1"
    max="5"
    value="3"
    required
>


<label>⏱️ Tiempo de llegada (minutos)</label>

<input
    type="number"
    id="tiempo"
    min="0"
    step="0.1"
    placeholder="Ej: 7"
    required
>


<button
    type="submit"
    class="guardar"
>
💾 GUARDAR OBSERVACIÓN
</button>

</form>

</div>


<div class="tarjeta">

<div class="contador">

📊 Observaciones:
<span id="cantidad">0</span>

</div>


<button
    class="gps"
    id="botonGPS"
>
📍 Guardar GPS de la última observación
</button>


<button
    class="exportar"
    id="botonExportar"
>
📤 Exportar observaciones CSV
</button>


<button
    class="exportar"
    id="botonExportarParadas"
>
📤 Exportar paradas CSV
</button>


<button
    class="borrar"
    id="botonBorrar"
>
🗑️ Borrar todas las observaciones
</button>

</div>


<div class="tarjeta">

<h2>📍 Paradas guardadas</h2>

<div id="listaParadas">

No hay paradas todavía.

</div>

</div>


<div class="tarjeta">

<h2>📋 Últimas observaciones</h2>

<div id="listaObservaciones">

No hay observaciones todavía.

</div>

</div>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

const CLAVE_OBSERVACIONES =
"observaciones_colectivos";

const CLAVE_PARADAS =
"paradas_colectivos";


let observaciones =
JSON.parse(
    localStorage.getItem(
        CLAVE_OBSERVACIONES
    ) || "[]"
);


let paradas =
JSON.parse(
    localStorage.getItem(
        CLAVE_PARADAS
    ) || "[]"
);


const mapa =
L.map("mapa").setView(
    [-27.4692, -58.8306],
    14
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
        '&copy; OpenStreetMap contributors'
    }
).addTo(mapa);


let marcadores = [];


function guardarTodo() {

    localStorage.setItem(
        CLAVE_OBSERVACIONES,
        JSON.stringify(observaciones)
    );

    localStorage.setItem(
        CLAVE_PARADAS,
        JSON.stringify(paradas)
    );

}


function actualizarMapa() {

    marcadores.forEach(
        function(marcador) {

            mapa.removeLayer(
                marcador
            );

        }
    );

    marcadores = [];


    paradas.forEach(
        function(parada) {

            const marcador =
            L.marker([
                parada.latitud,
                parada.longitud
            ]).addTo(mapa);


            marcador.bindPopup(
                "<b>📍 " +
                parada.nombre +
                "</b><br>" +
                "ID: " +
                parada.id
            );


            marcadores.push(
                marcador
            );

        }
    );

}


function actualizarSelect() {

    const select =
    document.getElementById(
        "paradaSeleccionada"
    );


    select.innerHTML =
    '<option value="">Seleccionar parada</option>';


    paradas.forEach(
        function(parada) {

            const opcion =
            document.createElement(
                "option"
            );


            opcion.value =
            parada.id;


            opcion.textContent =
            parada.nombre;


            select.appendChild(
                opcion
            );

        }
    );

}


function actualizarListaParadas() {

    const lista =
    document.getElementById(
        "listaParadas"
    );


    if (
        paradas.length === 0
    ) {

        lista.innerHTML =
        "No hay paradas todavía.";

        return;

    }


    lista.innerHTML = "";


    paradas.forEach(
        function(parada) {

            const elemento =
            document.createElement(
                "div"
            );


            elemento.className =
            "observacion";


            elemento.innerHTML = `

                <b>
                    📍 ${parada.nombre}
                </b>

                <br>

                ID:
                ${parada.id}

                <br>

                Latitud:
                ${parada.latitud.toFixed(6)}

                <br>

                Longitud:
                ${parada.longitud.toFixed(6)}

                <button
                    onclick="eliminarParada(${parada.id})"
                    class="borrar"
                >
                    🗑️ Eliminar
                </button>

            `;


            lista.appendChild(
                elemento
            );

        }
    );

}


function eliminarParada(id) {

    const confirmar =
    confirm(
        "¿Querés eliminar esta parada?"
    );


    if (!confirmar) {

        return;

    }


    paradas =
    paradas.filter(
        function(parada) {

            return parada.id !== id;

        }
    );


    guardarTodo();

    actualizarMapa();

    actualizarSelect();

    actualizarListaParadas();

}


document
.getElementById(
    "botonAgregarParada"
)
.addEventListener(
    "click",
    function() {

        alert(
            "Ahora tocá en el mapa donde está la parada."
        );


        mapa.once(
            "click",
            function(evento) {

                const nombre =
                prompt(
                    "¿Cómo se llama esta parada?"
                );


                if (!nombre) {

                    return;

                }


                const nuevaParada = {

                    id:
                    Date.now(),

                    nombre:
                    nombre,

                    latitud:
                    evento.latlng.lat,

                    longitud:
                    evento.latlng.lng

                };


                paradas.push(
                    nuevaParada
                );


                guardarTodo();

                actualizarMapa();

                actualizarSelect();

                actualizarListaParadas();


                alert(
                    "✅ Parada guardada correctamente."
                );

            }
        );

    }
);


function colocarFechaHora() {

    const ahora =
    new Date();


    const anio =
    ahora.getFullYear();


    const mes =
    String(
        ahora.getMonth() + 1
    ).padStart(
        2,
        "0"
    );


    const dia =
    String(
        ahora.getDate()
    ).padStart(
        2,
        "0"
    );


    const horas =
    String(
        ahora.getHours()
    ).padStart(
        2,
        "0"
    );


    const minutos =
    String(
        ahora.getMinutes()
    ).padStart(
        2,
        "0"
    );


    document.getElementById(
        "fecha"
    ).value =
    `${anio}-${mes}-${dia}`;


    document.getElementById(
        "hora"
    ).value =
    `${horas}:${minutos}`;

}


colocarFechaHora();


document
.getElementById(
    "formulario"
)
.addEventListener(
    "submit",
    function(evento) {

        evento.preventDefault();


        const idParada =
        Number(
            document.getElementById(
                "paradaSeleccionada"
            ).value
        );


        const parada =
        paradas.find(
            function(p) {

                return p.id === idParada;

            }
        );


        if (!parada) {

            alert(
                "❌ Primero seleccioná una parada."
            );

            return;

        }


        const nuevaObservacion = {

            fecha:
            document.getElementById(
                "fecha"
            ).value,

            hora:
            document.getElementById(
                "hora"
            ).value,

            linea:
            document.getElementById(
                "linea"
            ).value.trim(),

            parada:
            parada.nombre,

            id_parada:
            parada.id,

            sentido:
            document.getElementById(
                "sentido"
            ).value,

            trafico:
            Number(
                document.getElementById(
                    "trafico"
                ).value
            ),

            tiempo:
            Number(
                document.getElementById(
                    "tiempo"
                ).value
            ),

            latitud:
            parada.latitud,

            longitud:
            parada.longitud

        };


        observaciones.push(
            nuevaObservacion
        );


        guardarTodo();

        actualizarPantalla();


        alert(
            "✅ Observación guardada."
        );


        document.getElementById(
            "linea"
        ).value = "";


        document.getElementById(
            "tiempo"
        ).value = "";


        colocarFechaHora();

    }
);


function actualizarPantalla() {

    document.getElementById(
        "cantidad"
    ).textContent =
    observaciones.length;


    const lista =
    document.getElementById(
        "listaObservaciones"
    );


    if (
        observaciones.length === 0
    ) {

        lista.innerHTML =
        "No hay observaciones todavía.";

        return;

    }


    const ultimas =
    observaciones
    .slice()
    .reverse()
    .slice(
        0,
        10
    );


    lista.innerHTML = "";


    ultimas.forEach(
        function(obs) {

            const elemento =
            document.createElement(
                "div"
            );


            elemento.className =
            "observacion";


            elemento.innerHTML = `

                <b>
                    🚌 ${obs.linea}
                </b>

                <br>

                📅 ${obs.fecha}

                🕐 ${obs.hora}

                <br>

                📍 ${obs.parada}

                <br>

                ➡️ ${obs.sentido}

                <br>

                🚗 Tráfico:
                ${obs.trafico}/5

                <br>

                ⏱️ Llegada:
                ${obs.tiempo} minutos

            `;


            lista.appendChild(
                elemento
            );

        }
    );

}


document
.getElementById(
    "botonGPS"
)
.addEventListener(
    "click",
    function() {

        if (
            observaciones.length === 0
        ) {

            alert(
                "Primero guardá una observación."
            );

            return;

        }


        if (
            !navigator.geolocation
        ) {

            alert(
                "❌ GPS no disponible."
            );

            return;

        }


        navigator.geolocation.getCurrentPosition(

            function(posicion) {

                const ultima =
                observaciones[
                    observaciones.length - 1
                ];


                ultima.latitud =
                posicion.coords.latitude;


                ultima.longitud =
                posicion.coords.longitude;


                guardarTodo();


                alert(
                    "📍 GPS guardado."
                );

            },

            function() {

                alert(
                    "❌ No se pudo obtener la ubicación."
                );

            },

            {
                enableHighAccuracy:
                true,

                timeout:
                10000
            }

        );

    }
);


document
.getElementById(
    "botonExportar"
)
.addEventListener(
    "click",
    function() {

        if (
            observaciones.length === 0
        ) {

            alert(
                "No hay observaciones."
            );

            return;

        }


        const encabezados = [

            "fecha",
            "hora",
            "linea",
            "parada",
            "id_parada",
            "sentido",
            "trafico",
            "tiempo_llegada",
            "latitud",
            "longitud"

        ];


        let csv =
        encabezados.join(",") +
        "\n";


        observaciones.forEach(
            function(obs) {

                csv += [

                    obs.fecha,
                    obs.hora,
                    obs.linea,
                    obs.parada,
                    obs.id_parada,
                    obs.sentido,
                    obs.trafico,
                    obs.tiempo,
                    obs.latitud,
                    obs.longitud

                ].join(",") +
                "\n";

            }
        );


        descargarCSV(
            csv,
            "observaciones_colectivos.csv"
        );

    }
);


document
.getElementById(
    "botonExportarParadas"
)
.addEventListener(
    "click",
    function() {

        if (
            paradas.length === 0
        ) {

            alert(
                "No hay paradas."
            );

            return;

        }


        let csv =
        "id,nombre,latitud,longitud\n";


        paradas.forEach(
            function(parada) {

                csv += [

                    parada.id,
                    `"${parada.nombre}"`,
                    parada.latitud,
                    parada.longitud

                ].join(",") +
                "\n";

            }
        );


        descargarCSV(
            csv,
            "paradas_colectivos.csv"
        );

    }
);


function descargarCSV(
    contenido,
    nombre
) {

    const archivo =
    new Blob(
        [contenido],
        {
            type:
            "text/csv;charset=utf-8;"
        }
    );


    const url =
    URL.createObjectURL(
        archivo
    );


    const enlace =
    document.createElement(
        "a"
    );


    enlace.href =
    url;


    enlace.download =
    nombre;


    enlace.click();


    URL.revokeObjectURL(
        url
    );

}


document
.getElementById(
    "botonBorrar"
)
.addEventListener(
    "click",
    function() {

        const confirmar =
        confirm(
            "¿Seguro que querés borrar TODAS las observaciones?"
        );


        if (!confirmar) {

            return;

        }


        observaciones = [];


        guardarTodo();

        actualizarPantalla();


        alert(
            "🗑️ Observaciones eliminadas."
        );

    }
);


actualizarMapa();

actualizarSelect();

actualizarListaParadas();

actualizarPantalla();

</script>

</body>

</html>
